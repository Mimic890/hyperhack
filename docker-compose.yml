# Production: pulls the released image from GHCR. Local builds: compose.dev.yml.
services:
  hyperhack:
    image: ghcr.io/mimic890/hyperhack:0.1.0
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./data:/data
      - ./vault:/vault
    env_file: .env
    mem_limit: 256m
    pids_limit: 128
    logging:
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "/hyperhack", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped
