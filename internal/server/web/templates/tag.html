{{define "title"}}#{{.Tag}} — {{.Site.Name}}{{if gt .Page 1}} — {{t "page_of" "n" .Page "m" .Pages}}{{end}}{{end}}
{{define "main"}}
<section aria-labelledby="tag-title">
  <h1 id="tag-title" class="section-title">#{{.Tag}}</h1>
  <h2 class="sr">{{t "newest"}}</h2>
  {{- range .Posts}}
  {{template "row" .}}
  {{- end}}
</section>
{{- template "pager" .}}
{{end}}
