{{define "title"}}{{.Site.Name}}{{if gt .Page 1}} — {{t "page_of" "n" .Page "m" .Pages}}{{end}}{{end}}
{{define "main"}}
{{template "searchform" .}}
<section aria-labelledby="newest">
  <h1 id="newest" class="section-title">{{t "newest"}}</h1>
  {{- range .Posts}}
  {{template "card" .}}
  {{- else}}
  <p class="empty">{{t "no_posts"}}</p>
  {{- end}}
</section>
{{- template "pager" .}}
{{end}}
